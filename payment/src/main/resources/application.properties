spring.application.name=payment-service
spring.config.import=optional:classpath:application-common.properties

server.port=8083

spring.datasource.url=jdbc:postgresql://iamDb:5432/payment_db
spring.datasource.username=oms_user
spring.datasource.password=new_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=oms_user
spring.flyway.password=new_password

# OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://iam-service:8080/auth/.well-known/jwks.json


# Actuator / Prometheus

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

openapi.title=Payment Service API
oms.security.resource-server.enabled=true
oms.kafka.publisher.enabled=true
