spring.application.name=iam
server.port=8080
server.max-http-request-header-size=65536

spring.datasource.url=jdbc:postgresql://localhost:5432/iam_db
spring.datasource.username=oms_user
spring.datasource.password=new_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
# Disable Hibernate's automatic schema generation, let Flyway handle it
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.user=oms_user
spring.flyway.password=new_password

# JWT Configuration
jwt.expiration=86400000
jwt.private-
jwt.public-

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
